<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fullscreen Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-btn {
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            user-select: none;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Кнопка звука появляется только после запуска */
        #sound-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 3000;
            padding: 12px 18px;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 60px;
            height: 60px;
            display: none;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #sound-control:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.1);
        }

        #sound-control.visible {
            display: flex;
        }

        #sound-control.muted {
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            #start-btn {
                padding: 16px 40px;
                font-size: 22px;
            }
            #sound-control {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <button id="start-btn">▶ СТАРТ</button>
    </div>

    <!-- ВИДЕО -->
    <div id="video-container">
        <!-- Видео изначально с muted, чтобы браузер разрешил автозапуск -->
        <video id="main-video" playsinline muted preload="auto">
            <source src="TEST.mp4" type="video/mp4">
            Ваш браузер не поддерживает тег video.
        </video>
    </div>

    <!-- АУДИО — изначально muted -->
    <audio id="main-audio" preload="auto" muted>
        <source src="TEST.m4a" type="audio/mp4">
        Ваш браузер не поддерживает аудио.
    </audio>

    <!-- КНОПКА ВКЛЮЧЕНИЯ ЗВУКА (появляется после запуска) -->
    <button id="sound-control" class="muted">🔇</button>

    <script>
        (function() {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const video = document.getElementById('main-video');
            const audio = document.getElementById('main-audio');
            const soundBtn = document.getElementById('sound-control');
            
            let isSoundOn = false;
            let isStarted = false;

            // Включение полноэкранного режима
            function goFullscreen() {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            }

            // ГЛАВНАЯ ФУНКЦИЯ ЗАПУСКА
            function startVideo() {
                if (isStarted) return;
                isStarted = true;

                // 1. Скрываем стартовый экран
                startScreen.classList.add('hidden');

                // 2. Включаем полноэкранный режим
                goFullscreen();

                // 3. Запускаем ВИДЕО (оно muted, поэтому браузер разрешит)
                video.play().then(() => {
                    console.log('✅ Видео запущено (muted)');
                    
                    // 4. Запускаем АУДИО (тоже muted)
                    return audio.play();
                }).then(() => {
                    console.log('✅ Аудио запущено (muted)');
                    
                    // 5. Показываем кнопку управления звуком
                    soundBtn.classList.add('visible');
                    soundBtn.classList.add('muted');
                    soundBtn.textContent = '🔇';
                    
                    // 6. Через 0.3 секунды ВКЛЮЧАЕМ ЗВУК
                    // Это работает, потому что был клик по кнопке СТАРТ
                    setTimeout(() => {
                        video.muted = false;
                        audio.muted = false;
                        soundBtn.classList.remove('muted');
                        soundBtn.textContent = '🔊';
                        isSoundOn = true;
                        console.log('🔊 Звук включён!');
                    }, 300);
                    
                }).catch(err => {
                    console.warn('Ошибка запуска:', err);
                    // Если не получилось — показываем кнопку, чтобы пользователь мог попробовать снова
                    soundBtn.classList.add('visible');
                    soundBtn.classList.add('muted');
                    soundBtn.textContent = '🔇';
                });
            }

            // УПРАВЛЕНИЕ ЗВУКОМ ПО КНОПКЕ
            soundBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                if (isSoundOn) {
                    // Выключаем звук
                    video.muted = true;
                    audio.muted = true;
                    soundBtn.classList.add('muted');
                    soundBtn.textContent = '🔇';
                    isSoundOn = false;
                    console.log('🔇 Звук выключен');
                } else {
                    // Включаем звук
                    video.muted = false;
                    audio.muted = false;
                    soundBtn.classList.remove('muted');
                    soundBtn.textContent = '🔊';
                    isSoundOn = true;
                    console.log('🔊 Звук включён');
                }
            });

            // СИНХРОНИЗАЦИЯ ВРЕМЕНИ
            video.addEventListener('timeupdate', function() {
                if (Math.abs(audio.currentTime - video.currentTime) > 0.3) {
                    audio.currentTime = video.currentTime;
                }
            });

            // Если видео на паузе — аудио тоже на паузе
            video.addEventListener('pause', function() {
                if (!audio.paused) {
                    audio.pause();
                }
            });

            // Если видео запущено — аудио тоже запускаем
            video.addEventListener('play', function() {
                if (audio.paused && !video.paused) {
                    audio.play().catch(() => {});
                }
            });

            // ОБРАБОТЧИКИ КЛИКОВ ПО СТАРТУ
            startBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startVideo();
            });

            startScreen.addEventListener('click', startVideo);

            // Обработка ошибок
            video.addEventListener('error', function(e) {
                console.warn('Ошибка видео:', e);
            });

            audio.addEventListener('error', function(e) {
                console.warn('Ошибка аудио:', e);
            });

            console.log('✅ Готово. Нажмите СТАРТ для запуска видео со звуком!');
        })();
    </script>

</body>
</html>
