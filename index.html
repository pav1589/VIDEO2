<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fullscreen Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-btn {
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            user-select: none;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        @media (max-width: 480px) {
            #start-btn {
                padding: 16px 40px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">▶ СТАРТ</button>
    </div>

    <div id="video-container">
        <video id="main-video" playsinline preload="auto">
            <source src="TEST.mp4" type="video/mp4">
            Ваш браузер не поддерживает тег video.
        </video>
    </div>

    <audio id="main-audio" preload="auto">
        <source src="TEST.m4a" type="audio/mp4">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        (function() {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const video = document.getElementById('main-video');
            const audio = document.getElementById('main-audio');
            
            let isStarted = false;

            function goFullscreen() {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            }

            function startVideo() {
                if (isStarted) return;
                isStarted = true;

                startScreen.classList.add('hidden');
                goFullscreen();

                // 1. ПОЛНОСТЬЮ ОТКЛЮЧАЕМ ЗВУК В ВИДЕО (главный фикс)
                video.muted = true;
                video.volume = 0; // на всякий случай

                // 2. Запускаем видео (без звука)
                video.play().then(() => {
                    console.log('✅ Видео запущено (звук полностью отключён)');
                    
                    // 3. Запускаем аудио (со звуком)
                    return audio.play();
                }).then(() => {
                    console.log('✅ Аудио запущено');
                    console.log('🔊 Звук идёт только из аудиофайла');
                }).catch(err => {
                    console.warn('Ошибка запуска:', err);
                    // Если не получилось - пробуем снова
                    setTimeout(() => {
                        video.play().catch(() => {});
                        audio.play().catch(() => {});
                    }, 100);
                });
            }

            // Синхронизация времени
            video.addEventListener('timeupdate', function() {
                if (Math.abs(audio.currentTime - video.currentTime) > 0.3) {
                    audio.currentTime = video.currentTime;
                }
            });

            // Если видео на паузе - аудио тоже на паузе
            video.addEventListener('pause', function() {
                if (!audio.paused) {
                    audio.pause();
                }
            });

            // Если видео играет - аудио тоже играет
            video.addEventListener('play', function() {
                if (audio.paused && !video.paused) {
                    audio.play().catch(() => {});
                }
            });

            // Обработка кликов по СТАРТ
            startBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startVideo();
            });

            startScreen.addEventListener('click', startVideo);

            // Ошибки
            video.addEventListener('error', function(e) {
                console.warn('Ошибка видео:', e);
            });

            audio.addEventListener('error', function(e) {
                console.warn('Ошибка аудио:', e);
            });

            console.log('✅ Готово. Звук видео отключён, играет только аудио.');
        })();
    </script>

</body>
</html>
