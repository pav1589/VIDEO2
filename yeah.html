<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fullscreen Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* Стартовый экран с кнопкой */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-btn {
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            user-select: none;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* Контейнер видео */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Адаптив */
        @media (max-width: 480px) {
            #start-btn {
                padding: 16px 40px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <button id="start-btn">▶ СТАРТ</button>
    </div>

    <!-- ВИДЕО -->
    <div id="video-container">
        <video id="main-video" playsinline muted>
            <source src="TEST.mp4" type="video/mp4">
            Ваш браузер не поддерживает тег video.
        </video>
    </div>

    <script>
        (function() {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const video = document.getElementById('main-video');
            const container = document.getElementById('video-container');

            // Функция включения полноэкранного режима
            function goFullscreen() {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            }

            // Функция запуска видео
            function startVideo() {
                // Скрываем стартовый экран
                startScreen.classList.add('hidden');

                // Включаем полноэкранный режим
                goFullscreen();

                // Запускаем видео
                video.play().catch(err => {
                    console.warn('Автовоспроизведение заблокировано:', err);
                    // Если не запустилось, пробуем ещё раз через клик
                    document.addEventListener('click', function playOnClick() {
                        video.play().catch(() => {});
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            }

            // Обработчик клика по кнопке
            startBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startVideo();
            });

            // Клик по всему стартовому экрану тоже запускает видео
            startScreen.addEventListener('click', startVideo);

            // Обработка ошибок видео
            video.addEventListener('error', function(e) {
                console.warn('Ошибка загрузки видео:', e);
            });

            // Если видео уже загружено, но стартовый экран всё ещё виден - ничего не делаем
            // Ждём действия пользователя

            // При выходе из полноэкранного режима (если нажали ESC) - можно вернуть стартовый экран?
            // Но по заданию - просто видео без кнопок, поэтому оставляем как есть

            console.log('✅ Готово. Нажмите СТАРТ для запуска видео на весь экран.');
        })();
    </script>

</body>
</html>
